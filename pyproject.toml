[project]
name = "cyber-clinic"
version = "0.1.0"
description = "Always-on desktop sprite that patrols your machine and diagnoses failures in AI agents, terminals and games."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cyber-clinic = "clinic.daemon:main"
clinic-mcp = "clinic.mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clinic"]
